<!DOCTYPE html>
<html>
<head>
    <title>Flexbox Child Properties</title>

    <style>
        .container {
            display: flex;
   
            height: 400px;
            border: 3px solid darkblue;
            align-items: center;
        }
        .box {
            width: 100px;
            height: 100px;
            margin: 10px;
            background-color: lightpink;
            border: 4px solid rgb(230, 11, 84);
            text-align: center;
            line-height: 100px;
            font-weight: bold;
        }
        .box1 {
       
            flex-grow: 1;
            flex-basis: 200px ;
            flex-shrink: 6;  
               
        }
         .box2 {
            flex-grow:1;
            align-self: flex-start;
        }

        .box3 {
           flex-grow: 2;
        
        }

         .box4 {
            flex-grow: 2;
        }
        .box5 {
       
            flex-grow: 1;
        }
         .box6{
            flex-shrink: 5;
        }

        
        
    </style>
</head>

<body>

    <h2>Flexbox Child Properties</h2>

    <div class="container">

        <div class="box box1">Box 1</div>
        <div class="box box2">Box 2</div>
        <div class="box box3">Box 3</div>
        <div class="box box4">Box 4</div>
        <div class="box box5">Box 5</div>
        <div class="box box6">Box 6</div>

    </div>

</body>
</html>
