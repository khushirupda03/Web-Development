<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flex-parent </title>
  <style>
    .box
    {
      border: 5px solid rgb(216, 19, 151);
      margin: 10px;
      background-color: #fe71f2;
      text-align: center;
      font-weight: bold;
    }
    .container
    {
      display: flex;
      flex-direction: row;
      justify-content: flex-start;
      background-color: rgb(35, 186, 246);
      height: 300px;
      width: 100px;
      align-items: flex-start;
      flex-wrap: wrap;
      align-content:space-around;
    }
  </style>
</head>
<body>
    <div class="container">
      <div class="box">1</div>
      <div class="box">2</div>
      <div class="box">3</div>
      <div class="box">4</div>
      <div class="box">5</div>
      <div class="box">6</div>
      <div class="box">7</div>
      <div class="box">8</div>
      <div class="box">9</div>
      <div class="box">10</div>
    </div>
</body>
</html>
